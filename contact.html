<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eric Ochis - Contact</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f8ff;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Hidden class for toggling visibility */
        .hidden { display: none !important; }

        header {
            background-color: #beeeaf;
            color: #ffffff;
            padding: 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        h1 {
            font-size: 2em;
            text-shadow: 2px 2px 4px #888888;
            margin-left: -15%;
        }
        nav {
            background-color: #ffffff;
            padding: 1em 0;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            padding: 0.75em 1.5em;
            background-color: #2e86c1;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }
        nav a:hover {
            background-color: #ffffff;
        }
        main {
            padding: 0.5em;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 20px;
            flex: 1;
        }
        .resume-box {
            background-color: #ffffff;
            padding: 25px;
            box-shadow: 0 4px 8px #112;
            width: 40%;
            min-width: 300px;
            margin-bottom: 20px;
            text-align: center;
            border-radius: 10px;
            position: relative;
            z-index: 1;
        }
        
        /* Form Styles */
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 1.1em;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #2e86c1;
            border-radius: 5px;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            box-sizing: border-box;
            font-size: 1em;
        }
        
        /* Button Styles */
        .btn-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            color: white;
        }
        button:hover {
            transform: scale(1.05);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        #submitBtn { background-color: #2e86c1; }
        #aiBtn { background-color: #8e44ad; }

        footer {
            background-color: #2e86c1;
            color: white;
            text-align: center;
            padding: 0.3em 0;
            position: relative;
            width: 100%;
            font-size: 0.7em;
            z-index: 2;
        }

        /* Login Overlay Style */
        #login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #ffffe0;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <div id="login-container">
        <h1 style="font-size: 3vw; color: #112; text-shadow: none; margin: 0 0 20px 0;">Please log in</h1>
        <div id="buttonDiv"></div>
        <p id="error-message" style="color: red; display: none; margin-top: 15px; font-weight: bold;"></p>
    </div>

    <div id="protected-content" class="hidden">
        <header>
            <h1><a href="index.html" style="font-size: 3.5vw; color: white; text-decoration: none; text-shadow: 1px 1px 2px #112;">Eric Ochis</a></h1>
            <div style="margin-right: -15%;"> 
                <a href="about.html" style="font-size: 2vw; margin-right: 15px; color: white; text-decoration: none; text-shadow: 1px 1px 2px #112;">About</a>
                <a href="portfolio.html" style="font-size: 2vw; margin-right: 15px; color: white; text-decoration: none; text-shadow: 1px 1px 2px #112;">Portfolio</a>
                <a href="contact.html" style="font-size: 2vw; color: white; margin-right: 15px; text-decoration: none; text-shadow: 1px 1px 2px #112;">Contact</a>
                <a href="/crazyhouse/" style="font-size: 2vw; color: white; text-decoration: none; text-shadow: 1px 1px 2px #112;">Chess</a>
            </div>
        </header>
        <main>
                <div class="resume-box">
                    <h2 style="font-size: 2em;">Contact Info</h2>
                    <p style="font-size: 1.5em;">Phone: (610) 412-8777</p>
                    <p style="font-size: 1.5em;">Personal Email: eochis@outlook.com</p>
                    <p style="font-size: 1.5em;">School Email: eochis@cmu.edu</p>
                </div>

                <div class="resume-box">
                    <h2 style="font-size: 2em;">Send a Message</h2>
                    <form id="contactForm">
                        <div class="form-group">
                            <label for="name">Name:</label>
                            <input type="text" id="name" name="name" required placeholder="Your Name">
                        </div>
                        <div class="form-group">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" required placeholder="Your Email">
                        </div>
                        <div class="form-group">
                            <label for="message">Message:</label>
                            <textarea id="message" name="message" rows="8" required placeholder="- Write points here..."></textarea>
                        </div>
                        
                        <div class="btn-container">
                            <button type="button" id="aiBtn">✨ Draft with AI</button>
                            <button type="submit" id="submitBtn">Send Message</button>
                        </div>
                        <p id="statusMessage" style="display:none; margin-top:10px; font-weight:bold;"></p>
                    </form>
                </div>
        </main>
        <footer>
            <p>&copy; 2026 Eric Ochis</p>
            <p>Disclaimer: This site is partially generated by AI.</p>
        </footer>
    </div>

    <script>
        const BACKEND_URL = "https://eochis23-github-io.onrender.com"; 

        // --- AUTHENTICATION LOGIC ---

        function decodeJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                return JSON.parse(window.atob(base64));
            } catch (e) {
                return null;
            }
        }

        function handleCredentialResponse(response) {
            const data = decodeJwt(response.credential);
            
            // Check if user is from CMU (extra security layer)
            if (data && data.hd === "andrew.cmu.edu") {
                sessionStorage.setItem('cmuAuth', 'true');
                showContent();
            } else {
                const errorMsg = document.getElementById('error-message');
                errorMsg.innerText = "Access restricted to @andrew.cmu.edu accounts.";
                errorMsg.style.display = 'block';
            }
        }

        function showContent() {
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('protected-content').classList.remove('hidden');
        }

        window.onload = function () {
            if (sessionStorage.getItem('cmuAuth') === 'true') {
                showContent();
            } else {
                google.accounts.id.initialize({
                    client_id: "526379188595-uteji192qi0fc36aheui50ogbgkei087.apps.googleusercontent.com",
                    callback: handleCredentialResponse,
                    hd: "andrew.cmu.edu"
                });
                google.accounts.id.renderButton(
                    document.getElementById("buttonDiv"),
                    { theme: "outline", size: "large" }  
                );
            }
        }

        // --- AI DRAFT FEATURE ---
        const aiBtn = document.getElementById('aiBtn');
        const messageBox = document.getElementById('message');

        aiBtn.addEventListener('click', async function() {
            const bullets = messageBox.value;
            if (!bullets.trim()) {
                alert("Please type some bullet points first!");
                return;
            }

            aiBtn.disabled = true;
            aiBtn.innerText = "✨ Thinking...";

            try {
                const response = await fetch(`${BACKEND_URL}/api/draft-email`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        bullets: bullets, 
                        name: document.getElementById('name').value 
                    }) 
                });
                const data = await response.json();
                if (data.draft) messageBox.value = data.draft;
            } catch (error) {
                console.error("AI Error:", error);
            } finally {
                aiBtn.disabled = false;
                aiBtn.innerText = "✨ Draft with AI";
            }
        });

        // --- SEND MESSAGE FEATURE ---
        document.getElementById('contactForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMessage');
            
            submitBtn.disabled = true;
            submitBtn.innerText = "Sending...";

            try {
                const response = await fetch(`${BACKEND_URL}/api/contact`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('name').value,
                        email: document.getElementById('email').value,
                        message: document.getElementById('message').value
                    })
                });

                if (response.ok) {
                    statusMsg.innerText = "Thanks! Message sent successfully.";
                    statusMsg.style.color = "green";
                    document.getElementById('contactForm').reset();
                }
            } catch (error) {
                statusMsg.innerText = "Failed to connect to server.";
                statusMsg.style.color = "red";
            } finally {
                statusMsg.style.display = "block";
                submitBtn.disabled = false;
                submitBtn.innerText = "Send Message";
            }
        });
    </script>
</body>
</html>
